<section id="section-testimonials" class="section section--alt testimonials">
  <div class="container">
    <header class="section-head" appReveal>
      <p class="eyebrow">{{ subtitle() }}</p>
      <h2 class="section-title">{{ title() }}</h2>
    </header>

    <div class="testimonials__grid">
      @for (item of items(); track item.id; let i = $index) {
      <figure class="quote card-glass card-glass--hover" appReveal [revealDelay]="i * 90">
        <app-icon name="quote" [size]="34" class="quote__mark" />
        <blockquote>{{ item.text }}</blockquote>
        <figcaption>
          <img [src]="item.authorImage" [alt]="item.authorName" loading="lazy" decoding="async" width="56" height="56">
          <span>
            <strong>{{ item.authorName }}</strong>
            <small>{{ item.authorRole }}</small>
          </span>
        </figcaption>
      </figure>
      }
    </div>
  </div>
</section>
