<section id="section-about" class="section grid-bg about">
  <div class="container">
    <header class="section-head" appReveal>
      <p class="eyebrow">Nosotros</p>
      <h2 class="section-title">{{ title() }}</h2>
    </header>

    <div class="about__grid">
      @for (item of items(); track item.id; let i = $index) {
      <article class="about__card card-glass card-glass--hover" (click)="openModal(i)" appReveal [revealDelay]="i * 90">
        <span class="about__img">
          <img [src]="item.imageUrl" [alt]="item.title" loading="lazy" decoding="async" width="400" height="260">
        </span>
        <div class="about__body">
          <span class="about__index" aria-hidden="true">0{{ i + 1 }}</span>
          <h3>{{ item.title }}</h3>
          <p class="about__excerpt">{{ item.description }}</p>
          <button type="button" class="about__more" [attr.aria-label]="'Ver más sobre ' + item.title">Ver más <app-icon name="arrow-right" [size]="16" /></button>
        </div>
      </article>
      }
    </div>
  </div>
</section>

@if (activeItem(); as item) {
<app-modal [label]="item.title" (closed)="closeModal()">
  <div class="modal__media">
    <img [src]="item.imageUrl" [alt]="item.title" loading="lazy">
  </div>
  <div class="modal__body">
    <p class="eyebrow">Delfos Ltda</p>
    <h3 class="modal__title">{{ item.title }}</h3>
    <p class="modal__text">{{ item.description || 'Pronto agregaremos más información sobre este tema.' }}</p>
  </div>
</app-modal>
}
