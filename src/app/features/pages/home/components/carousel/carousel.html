<section class="section section-carousel" id="section-carousel">
    <div class="container-fluid container-carousel">
        <div class="carousel-wrapper">
            <button class="carousel-control prev" (click)="prev()" aria-label="Anterior">
                &#10094;
            </button>
            <div class="carousel" #carouselContainer (scroll)="onScroll()">
                @for (slide of slides(); track slide.id; let i = $index) {
                <div class="card card-{{ i + 1 }}">
                    <picture class="slide-picture">
                        <source media="(width < 800px)" [srcset]="slide.imageMobile" />
                        <source media="(width >= 800px)" [srcset]="slide.imageDesktop" />
                        <img class="img-carousel" [src]="slide.imageDesktop" [alt]="slide.title" />
                    </picture>
                    <div class="slide-content">
                        <h2 class="slide-title">{{ slide.title }}</h2>
                        <p class="slide-text">{{ slide.text }}</p>
                        <button class="slide-btn">{{ slide.linkText }}</button>
                    </div>
                </div>
                }
            </div>
            <button class="carousel-control next" (click)="next()" aria-label="Siguiente">
                &#10095;
            </button>

            <div class="carousel-indicators">
                @for (slide of slides(); track slide.id; let i = $index) {
                <button class="dot" [class.active]="currentIndex === i" (click)="goTo(i)"
                    [attr.aria-label]="'Ir a diapositiva ' + (i + 1)"></button>
                }
            </div>
        </div>
    </div>
</section>
