<section id="section-indicators" class="section indicators">
  <div class="indicators__bg" aria-hidden="true"></div>
  <div class="container">
    <h2 class="indicators__title" appReveal>{{ title() }}</h2>

    <div class="indicators__grid" appReveal (revealed)="animate()">
      @for (item of indicators(); track item.id; let i = $index) {
      <div class="stat">
        <span class="stat__number">+{{ display()[i] }}</span>
        <span class="stat__label">{{ item.label }}</span>
      </div>
      }
    </div>
  </div>
</section>
