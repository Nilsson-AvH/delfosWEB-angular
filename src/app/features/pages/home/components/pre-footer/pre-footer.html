<section class="cta" aria-labelledby="cta-title">
  <div class="container">
    <div class="cta__box" appReveal>
      <span class="cta__icon"><app-icon name="file-pdf" [size]="34" [stroke]="1.5" /></span>
      <div class="cta__text">
        <h2 id="cta-title">{{ content().text }}</h2>
        <p class="muted">Conoce nuestros servicios, certificaciones y cobertura en un solo documento.</p>
      </div>
      <a [href]="content().pdfUrl" class="btn btn--primary" download target="_blank" rel="noopener">
        <app-icon name="download" [size]="18" /> {{ content().pdfButtonText }}
      </a>
    </div>
  </div>
</section>
