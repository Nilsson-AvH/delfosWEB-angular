<div class="floating">
  @if (showTop()) {
  <button type="button" class="btn btn--icon" (click)="scrollToTop()" aria-label="Volver arriba" title="Volver arriba">
    <app-icon name="arrow-up" [size]="20" />
  </button>
  }
  <a [href]="'https://wa.me/' + cleanPhone()" class="btn btn--icon floating__wa" target="_blank" rel="noopener noreferrer"
    aria-label="Escríbenos por WhatsApp" title="Escríbenos por WhatsApp">
    <app-icon name="whatsapp" [size]="26" />
  </a>
</div>
